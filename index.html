<!DOCTYPE html>
<html lang="en" data-skin="pine">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070f0c">
  <meta name="description" content="Ship It: an idle game about writing code. Tap the key, install a rubber duck, ship the release.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ship It">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>Ship It</title>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="tline" id="tline" hidden></div>
      <div class="readout">
        <div class="count"><b id="loc">0</b><span class="unit">loc</span></div>
        <div class="sub" id="sub"></div>
      </div>
      <div class="rates">
        <span><b id="rTap"></b> /tap</span>
        <span><b id="rAuto"></b> /s</span>
      </div>
    </header>

    <div class="goal" id="goal" aria-label="Next goal">
      <div class="g1"><span class="gk" id="goalKey">next ★</span><span class="gbar"><i id="goalBar"></i></span><span class="gpct" id="goalPct"></span><span class="geta" id="goalEta"></span></div>
      <div class="g2"><span id="goalReady"></span><span id="goalNext"></span></div>
    </div>

    <section class="ide" aria-label="Code editor">
      <div class="tabline"><span class="tab on" id="mainTab">main.ts</span><span class="tab sp" id="sTab" hidden></span><span class="ptabs" id="pTabs"></span><span class="fill"></span><span class="path" id="path">~/web-app/src</span></div>
      <div class="sbar"><i id="sBar"></i></div>
      <div class="code" id="code">
        <div class="lines" id="lines" aria-hidden="true"><div class="ln live" id="live"></div></div>
        <div class="mini" id="mini" aria-hidden="true"></div>
        <div class="saver" id="saver" hidden aria-hidden="true"><canvas></canvas><div class="savertag" id="saverTag"></div></div>
      </div>
      <div class="desks" id="desks" hidden aria-label="Team"></div>
      <div class="pane" id="pane" hidden>
        <div class="ptitle"><span class="pname" id="paneName">1:top</span><span class="fill"></span><span id="paneStat"></span></div>
        <div class="plog" id="paneLog"></div>
      </div>
      <div class="status">
        <span class="mode" id="mode">NORMAL</span>
        <span class="flow" id="flow" title="Flow state: keep typing to fill it"></span>
        <span class="br">main</span>
        <span id="stLn"></span>
        <span id="stProb">0 problems</span>
        <span id="stDebt" hidden></span>
        <span class="fill"></span>
        <span class="ft" id="stLang">utf-8 · ts</span>
      </div>
    </section>

    <div class="event" id="event" aria-live="polite"></div>

    <div class="keywrap">
      <button class="key" id="key" aria-label="Write code">
        <span class="prompt">❯</span><span class="leg">write_code()</span><i class="kcur"></i>
        <span class="kval"><b id="kTap"></b><small id="kSub"></small></span>
        <span class="hint">[enter] or any key</span>
      </button>
    </div>

    <div class="scripts" id="scripts" hidden role="group" aria-label="Scripts in ~/bin"></div>

    <section class="panel">
      <div class="subtabs" id="subtabs" role="tablist" aria-label="Sections" hidden></div>
      <div class="pbody" id="panel" role="tabpanel" aria-live="off"></div>
    </section>

    <nav class="bar" role="tablist" aria-label="Panels">
      <span class="sess" id="sess">ship-it</span>
      <button role="tab" data-group="pkgs"><span class="tl">pkgs</span><span class="bd"></span></button>
      <button role="tab" data-group="work" hidden><span class="tl">work</span><span class="bd"></span></button>
      <button role="tab" data-group="ship" hidden><span class="tl">ship</span><span class="bd"></span></button>
      <button role="tab" data-group="co" hidden><span class="tl">co</span><span class="bd"></span></button>
      <button role="tab" data-group="more"><span class="tl">more</span><span class="bd"></span></button>
      <span class="clock" id="clock"></span>
    </nav>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
