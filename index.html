<!DOCTYPE html>
<html lang="en" data-skin="pine">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070f0c">
  <meta name="description" content="Ship It: an idle game about writing code. Tap the key, install a rubber duck, ship the release.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ship It">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>Ship It</title>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="readout">
        <div class="count"><b id="loc">0</b><span class="unit">loc</span></div>
        <div class="sub" id="sub"></div>
      </div>
      <div class="rates">
        <span><b id="rTap"></b> /tap</span>
        <span><b id="rAuto"></b> /s</span>
        <span class="spark" id="spark" aria-hidden="true"></span>
        <span class="fx" id="fx" hidden></span>
      </div>
    </header>

    <section class="ide" aria-label="Code editor">
      <div class="tabline"><span class="tab on" id="mainTab">main.ts</span><span class="tab sp" id="sTab" hidden></span><span class="xtabs" id="xTabs" aria-hidden="true"></span><span class="fill"></span><span class="path" id="path">~/web-app/src</span></div>
      <div class="sbar"><i id="sBar"></i></div>
      <div class="code" id="code">
        <div class="lines" id="lines" aria-hidden="true"><div class="ln live" id="live"></div></div>
        <div class="mini" id="mini" aria-hidden="true"></div>
        <div class="toasts" id="toasts" aria-live="polite"></div>
        <div class="saver" id="saver" hidden aria-hidden="true"><canvas></canvas><div class="savertag" id="saverTag"></div></div>
      </div>
      <div class="pane" id="pane" hidden aria-hidden="true">
        <div class="ptitle"><span class="pname" id="paneName">1:ci</span><span class="fill"></span><span id="paneStat"></span></div>
        <div class="plog" id="paneLog"></div>
      </div>
      <div class="status">
        <span class="mode" id="mode">NORMAL</span>
        <span class="flow" id="flow" title="Flow state: keep typing to fill it"></span>
        <span class="br">main</span>
        <span id="stLn"></span>
        <span id="stProb">0 problems</span>
        <span id="stDebt" hidden></span>
        <span class="fill"></span>
        <span class="ft" id="stLang">utf-8 · ts</span>
      </div>
    </section>

    <div class="keywrap">
      <button class="key" id="key" aria-label="Write code">
        <span class="prompt">❯</span><span class="leg">write_code()</span><i class="kcur"></i>
        <span class="hint">[enter] or any key</span>
      </button>
    </div>

    <section class="panel" id="panel" role="tabpanel" aria-live="off"></section>

    <nav class="bar" role="tablist" aria-label="Panels">
      <span class="sess" id="sess">ship-it</span>
      <button role="tab" data-tab="upgrades"><span class="ix">0:</span><span class="tl">pkgs</span></button>
      <button role="tab" data-tab="sprints" hidden><span class="ix">1:</span><span class="tl">sprints</span></button>
      <button role="tab" data-tab="todo" hidden><span class="ix">2:</span><span class="tl">todo</span></button>
      <button role="tab" data-tab="ship" hidden><span class="ix">3:</span><span class="tl">ship</span></button>
      <button role="tab" data-tab="team" hidden><span class="ix">4:</span><span class="tl">team</span></button>
      <button role="tab" data-tab="mail" hidden><span class="ix">5:</span><span class="tl">mail</span></button>
      <span class="fill"></span>
      <button role="tab" data-tab="settings" class="cfg" aria-label="Settings">cfg</button>
      <span class="clock" id="clock"></span>
    </nav>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
